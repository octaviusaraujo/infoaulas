<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex: Formulário 2</title>
</head>
<body>
    <form action="#" method="GET">
        <fieldset>
            <legend>Qual o seu nome?</legend>
            <input type="text" name="nome"/>
        </fieldset>
        <fieldset>
            <legend>Qual a sua data de nascimento?</legend>
            <input type="date" name="nasc"/>
        </fieldset>
        <fieldset>
            <legend>Qual a sua hora de nascimento?</legend>
            <input type="time" name="hr_nasc" />
        </fieldset>
        <fieldset>
            <legend>Qual a sua idade?</legend>
            <input type="number" name="idade" min="0" max="200"/>
        </fieldset>
        <fieldset>
            <legend>Qual a sua cor favorita?</legend>
            <input type="color" name="fav_cor"/>
        </fieldset>
        <fieldset>
            <legend>Qual o seu email?</legend>
            <input type="email" name="email"/>
        </fieldset>
        <fieldset>
            <legend>Qual a URL do seu instagram?</legend>
            <input type="url" name="instagram"/>
        </fieldset>
        <fieldset>
            <legend>Qual a sua senha?</legend>
            <input type="password" name="senha"/>
        </fieldset>
        <fieldset>
            <legend>Enviar foto de perfil</legend>
            <input type="file" name="foto"/>
        </fieldset>
        <fieldset>
            <legend>Quem é você? Faça uma biografia.</legend>
            <textarea name="bio" rows="5" cols="50">             
            </textarea>
        </fieldset>
        <fieldset>
            <legend>Qual o seu telefone?</legend>
            <input type="tel" name="telefone"/>
        </fieldset>
        <fieldset>
            <input type="submit"/>
            <input type="reset" value="Limpar">
        </fieldset>
    </form>
</body>
</html>
