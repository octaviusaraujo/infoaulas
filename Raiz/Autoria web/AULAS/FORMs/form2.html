<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX: Formulario 2</title>
</head>

<body>
    <form action="#" method="get">
        <fieldset>
            <legend>Qual é seu nome?</legend> <input type="text" name="nome">
        </fieldset>
        <fieldset>
            <legend>Qual é sua data de nascimento?</legend> <input type="date" name="nasc">
        </fieldset>
        <fieldset>
            <legend>Qual é sua idade?</legend> <input type="number" name="idade" min="0" max="100">
        </fieldset>
        <fieldset>
            <legend>Qual é sua hora de nascimento?</legend> <input type="time" name="hora">
        </fieldset>
        <fieldset> <input type="submit" id="enviar-btn" value="Enviar"> </fieldset>
        <fieldset>
            <legend>Qual é seu email?</legend> <input type="email" id="gmail" name="email"
                placeholder="seu.email@gmail.com">
        </fieldset>
        <fieldset>
            <legend>Passa teu insta</legend> <input type="" name="insta" placeholder="@fulano">
        </fieldset>
        <fieldset>
            <legend>manda uma foto tua ae</legend> <input type="file" name="foto">
        </fieldset>
    </form>
</body>

</html>
